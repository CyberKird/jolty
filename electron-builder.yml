appId: com.joltarise.jolty
productName: Jolty
npmRebuild: false
# public releases, read anonymously by the in-app updater (see src/main/updater.ts)
publish:
  provider: github
  owner: CyberKird
  repo: jolty
  releaseType: release
copyright: Copyright © 2026 Joltarise
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - package.json
# Claude Code and Codex are native executables: they cannot run from inside app.asar
asarUnpack:
  - node_modules/@anthropic-ai/claude-agent-sdk-*/**
  - node_modules/@openai/codex-*/**
  # Jolty in Chrome: Playwright MCP runs as a child process, outside the archive
  - node_modules/@playwright/mcp/**
  - node_modules/playwright/**
  - node_modules/playwright-core/**
extraResources:
  - from: build/icon.ico
    to: icon.ico
  # Microsoft Visual C++ runtime, installed by the setup when missing (downloaded by CI, see README)
  - from: build/redist/vc_redist.x64.exe
    to: redist/vc_redist.x64.exe
win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.ico
  executableName: Jolty
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Jolty
  artifactName: Jolty-Setup-${version}.${ext}
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  include: build/installer.nsh
  # Romanian installer texts
  language: "1048"
  installerLanguages: [ro_RO]
  # conversations, profiles and logins stay after an uninstall
  deleteAppDataOnUninstall: false
