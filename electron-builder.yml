appId: com.joltarise.jolty
productName: Jolty
npmRebuild: false
# public releases, read anonymously by the in-app updater (see src/main/updater.ts)
publish:
  provider: github
  owner: CyberKird
  repo: jolty
  releaseType: release
copyright: Copyright © 2026 Joltarise
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - package.json
# Claude Code and Codex are native executables: they cannot run from inside app.asar
asarUnpack:
  - node_modules/@anthropic-ai/claude-agent-sdk-*/**
  - node_modules/@openai/codex-*/**
  # Jolty in Chrome: Playwright MCP runs as a child process, outside the archive
  - node_modules/@playwright/mcp/**
  - node_modules/playwright/**
  - node_modules/playwright-core/**
extraResources:
  # Jolty's own browser extension: copied to the user's data folder, then loaded by the browser from there
  - from: browser-extension
    to: browser-extension
  # the same for Firefox, which has no DevTools protocol for extensions and needs its own script
  - from: browser-extension-firefox
    to: browser-extension-firefox
  # the same extension signed by Mozilla (unlisted): installs once in Firefox and stays, see scripts/sign-firefox.mjs
  - from: browser-extension-firefox-signed
    to: browser-extension-firefox-signed
win:
  # Windows only: the icon, the Vulkan whisper-cli build and the VC++ setup
  extraResources:
    - from: build/icon.ico
      to: icon.ico
    # whisper-cli (Vulkan) for voice input, fetched by scripts/fetch-redist.mjs
    - from: build/whisper
      to: whisper
    # Microsoft Visual C++ runtime, installed by the setup when missing (downloaded by CI, see README)
    - from: build/redist/vc_redist.x64.exe
      to: redist/vc_redist.x64.exe
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.ico
  executableName: Jolty
mac:
  # one dmg for the machine that builds it: npm only installs the engine binaries of its own CPU, so the
  # arm64 and x64 builds run on their own CI runners. No zip: it only serves the in-app updater (off on macOS)
  target: dmg
  # electron-builder turns the 1024px PNG into an .icns
  icon: build/icon.png
  category: public.app-category.developer-tools
  extraResources:
    # whisper-cli (Metal) for voice input, fetched by scripts/fetch-whisper-mac.mjs
    - from: build/whisper-mac
      to: whisper
  # ad-hoc signature: Apple Silicon refuses unsigned code. Replace "-" with a Developer ID (and turn on
  # hardenedRuntime + notarize) to get past Gatekeeper and to enable in-app updates (see src/main/updater.ts)
  identity: "-"
  hardenedRuntime: false
  extendInfo:
    NSMicrophoneUsageDescription: Jolty uses the microphone for voice input in the composer.
dmg:
  artifactName: Jolty-${version}-${arch}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Jolty
  artifactName: Jolty-Setup-${version}.${ext}
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  include: build/installer.nsh
  # Romanian installer texts
  language: "1048"
  installerLanguages: [ro_RO]
  # conversations, profiles and logins stay after an uninstall
  deleteAppDataOnUninstall: false
